<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Forderbar – Regelgestütztes Screening</title><style>body{font:15px/1.5 system-ui;color:#193d31;background:#f6f7f4;margin:0}main{max-width:850px;margin:auto;padding:28px}section{background:white;border:1px solid #dbe4dd;border-radius:12px;padding:22px;margin:16px 0}select,input,textarea{display:block;width:100%;max-width:600px;padding:10px;margin:6px 0 16px;border:1px solid #aebdb2;border-radius:7px;font:inherit}label{display:block;margin:12px 0;font-weight:600}label.check{font-weight:400}label.check input{display:inline;width:auto;margin-right:10px}button{padding:12px 20px;background:#193d31;color:white;border:0;border-radius:8px;cursor:pointer}li{margin:7px 0}a{color:#285b44}</style></head><body><main><a href="/admin/">← Admin</a><h1>Regelgestütztes Fall-Screening</h1><p>Testbetrieb. Die Regelbibliothek liefert eine vorläufige Empfehlung, keine automatische Inkassofreigabe.</p><section id="gate">Berechtigung wird geprüft …</section><section id="form" hidden><label>Testfallreferenz<input id="caseRef" placeholder="VI-2026-0001"></label><button id="loadCase" type="button">Fallakte laden</button><p id="caseStatus"></p><label>Bereich<select id="field"></select></label><label>Streitpunkt<select id="issue"></select></label><label>Forderung in EUR<input id="amount" type="number" min="0" step=".01" value="250"></label><label class="check"><input id="claim" type="checkbox">Anspruch und Betrag sind nachvollziehbar beziffert</label><label class="check"><input id="contract" type="checkbox">Vertrag / Bestell- oder Buchungsgrundlage liegt vor</label><label class="check"><input id="payment" type="checkbox">Zahlungsbeleg liegt vor</label><label class="check"><input id="due" type="checkbox">Fälligkeit und Rückzahlungsaufforderung sind dokumentiert</label><label class="check"><input id="objection" type="checkbox">Es gibt wesentliche Einwendungen / widersprüchliche Belege</label><label class="check"><input id="expired" type="checkbox">Verjährung oder Sonderfrist ist ungeklärt</label><button id="evaluate" type="button">Mit Bibliotheksregel prüfen</button><div id="result" role="status" aria-live="polite"></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.79.0/dist/umd/supabase.min.js"></script><script>const db=window.supabase.createClient('https://gyapckgyqxqcquxuhunz.supabase.co','sb_publishable_5qaJkw9dQtYhcQBHF_JDVQ_BgTTFCc2');const $=id=>document.getElementById(id);let lib,lastDecision=null,lastReasons=[];function opt(value,label){const o=document.createElement('option');o.value=value;o.textContent=label;return o}function issues(){const f=lib.fields.find(x=>x.id===$('field').value);$('issue').replaceChildren(...f.disputes.map(d=>opt(d.id,d.title)))}function evalRule(){const f=lib.fields.find(x=>x.id===$('field').value),rule=f.disputes.find(x=>x.id===$('issue').value);const missing=[['claim','Anspruch und Betrag'],['contract','Vertragsgrundlage'],['payment','Zahlungsbeleg'],['due','Fälligkeit und Aufforderung']].filter(([id])=>!$(id).checked).map(x=>x[1]);const complex=rule.suitability!=='good_candidate_if_documented';const objections=$('objection').checked||$('expired').checked;const amount=Number($('amount').value);let decision='BORDERLINE';let reasons=[];if(!Number.isFinite(amount)||amount<=0){decision='REJECT';reasons.push('Kein positiver bezifferter Rückzahlungsbetrag')}else if(missing.length){reasons.push('Fehlende Nachweise: '+missing.join(', '))}if(complex)reasons.push('Dieser Streitpunkt ist individuell und beweisintensiv');if(objections)reasons.push('Einwendungen oder Fristen müssen juristisch geprüft werden');if(!reasons.length){decision='ACCEPT_CANDIDATE';reasons.push('Vorläufig geeignet – menschliche Beleg- und Rechtsprüfung erforderlich')}lastDecision=decision;lastReasons=reasons;const out=$('result');out.replaceChildren();const h=document.createElement('h2');h.textContent=decision;out.append(h);for(const reason of reasons){const p=document.createElement('p');p.textContent=reason;out.append(p)}const p=document.createElement('p');p.textContent='Regel: '+rule.id+' · '+f.legal_basis+' · Version '+lib.schema_version+'. Empfehlung ohne Versand und ohne automatische Annahme.';out.append(p);const list=document.createElement('ul');for(const evidence of rule.evidence){const li=document.createElement('li');li.textContent=evidence;list.append(li)}out.append(document.createTextNode('Erforderliche Belege:'),list);const save=document.createElement('button');save.type='button';save.textContent='Screening in Testfall speichern';save.onclick=async()=>{const ref=$('caseRef').value.trim();if(!/^VI-2026-[0-9]{4}$/.test(ref)){$('caseStatus').textContent='Gültige Testreferenz erforderlich';return}const {data,error}=await db.rpc('forderbar_save_rule_screening_preview',{p_reference:ref,p_rule_id:rule.id,p_decision:decision,p_reasons:reasons});$('caseStatus').textContent=error?'Speichern fehlgeschlagen: '+error.message:'Screening protokolliert: '+data};out.append(save)}async function init(){const {data:{user}}=await db.auth.getUser();if(!user){$('gate').textContent='Bitte zuerst als Administrator anmelden.';return}const {error}=await db.rpc('forderbar_admin_dashboard_preview');if(error){$('gate').textContent='Keine Administratorberechtigung.';return}const response=await fetch('/data/dispute-library.v1.json',{cache:'no-store'});if(!response.ok){$('gate').textContent='Regeln nicht geladen.';return}lib=await response.json();$('gate').textContent='Bibliothek geladen: '+lib.fields.length+' Bereiche · '+lib.fields.reduce((n,f)=>n+f.disputes.length,0)+' Regeln';$('form').hidden=false;$('field').replaceChildren(...lib.fields.map(f=>opt(f.id,f.name)));$('field').onchange=issues;$('evaluate').onclick=evalRule;$('loadCase').onclick=async()=>{const ref=$('caseRef').value.trim();if(!/^VI-2026-[0-9]{4}$/.test(ref)){$('caseStatus').textContent='Ungültige Testreferenz';return}const {data,error}=await db.rpc('forderbar_admin_case_details_preview',{p_case_reference:ref});if(error||!data?.intake){$('caseStatus').textContent='Fall nicht gefunden';return}$('amount').value=(Number(data.intake.amount_cents)/100).toFixed(2);const map={retail:'online-shopping',subscription:'abos-vertraege',telecom:'internet-mobilfunk',energy:'strom-energie',travel:'reisen',auto:'auto-mobilitaet'};$('field').value=map[data.intake.category]||'online-shopping';issues();$('caseStatus').textContent='Testfall geladen: '+ref+'; Nachweise müssen weiterhin geprüft werden'};issues()}init();</script></body></html>
