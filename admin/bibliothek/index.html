<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Forderbar – Interne Streitfallbibliothek</title><style>body{margin:0;background:#f6f7f4;color:#193d31;font:15px/1.55 system-ui}main{max-width:1080px;margin:auto;padding:32px 20px}h1{font-size:clamp(28px,4vw,44px)}section,article{background:white;border:1px solid #dce5de;border-radius:14px;padding:20px;margin:14px 0}select,input{font:inherit;padding:11px;border:1px solid #b3c5b8;border-radius:8px;margin:5px;max-width:95%}button{background:#193d31;color:white;border:0;padding:10px 16px;border-radius:8px;cursor:pointer}small,.muted{color:#596d60}details{border-top:1px solid #e2e9e4;padding:10px 0}summary{cursor:pointer;font-weight:650}li{margin:4px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}a{color:#286044}</style></head><body><main><a href="/admin/">← Admin</a><h1>Interne Streitfallbibliothek</h1><p>72 vorläufige Falltypen in acht Bereichen. Keine juristische Freigabe und keine empirischen Erfolgsquoten. Kein automatischer Versand.</p><section><label for="field">Bereich</label><select id="field"><option value="">Alle Bereiche</option></select><label for="search">Streitpunkt</label><input id="search" placeholder="z. B. Rückzahlung"><p id="count" role="status"></p></section><div id="results"></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.79.0/dist/umd/supabase.min.js"></script><script>const db=window.supabase.createClient('https://gyapckgyqxqcquxuhunz.supabase.co','sb_publishable_5qaJkw9dQtYhcQBHF_JDVQ_BgTTFCc2');const $=id=>document.getElementById(id);let library;function el(tag,text){const e=document.createElement(tag);if(text!==undefined)e.textContent=text;return e}function line(parent,title,items){const p=el('p',title);parent.append(p);const ul=el('ul');for(const x of items||[])ul.append(el('li',x));parent.append(ul)}function render(){const q=$('search').value.toLocaleLowerCase('de');const selected=$('field').value;const out=$('results');out.replaceChildren();let count=0;for(const f of library.fields){if(selected&&selected!==f.id)continue;const matches=f.disputes.filter(x=>(x.title+' '+x.id).toLocaleLowerCase('de').includes(q));if(!matches.length)continue;const section=el('section');section.append(el('h2',f.name));section.append(el('p','Rechtsgrundlagen (Arbeitsfassung): '+f.legal_basis));for(const c of matches){count++;const d=el('details');d.append(el('summary',c.title+' · '+(c.suitability==='good_candidate_if_documented'?'Potentiell geeignet':'Einzelfallprüfung')));line(d,'Muss-Kriterien',c.must);line(d,'Kann-Kriterien',c.supporting);line(d,'Belege',c.evidence);line(d,'Einwände',c.company_objections);line(d,'Risiken',c.risk_flags);d.append(el('p','Fristen: '+c.limitation));d.append(el('p','Vorläufige Empfehlung: '+c.recommendation));d.append(el('p','Ablehnungsvorlage: '+c.decision_template));section.append(d)}out.append(section)}$('count').textContent=count+' Streitpunkte';}async function start(){const {data:{user}}=await db.auth.getUser();if(!user){$('results').textContent='Bitte zuerst im Admin-Bereich anmelden.';return}const {error}=await db.rpc('forderbar_admin_dashboard_preview');if(error){$('results').textContent='Keine Administratorberechtigung.';return}const r=await fetch('/data/dispute-library.v1.json',{cache:'no-store'});if(!r.ok){$('results').textContent='Bibliothek nicht verfügbar.';return}library=await r.json();for(const f of library.fields){const o=el('option',f.name);o.value=f.id;$('field').append(o)}$('field').onchange=render;$('search').oninput=render;render()}start();</script></body></html>
