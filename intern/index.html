<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Forderbar – Interne Fallprüfung</title><style>*{box-sizing:border-box}body{font:16px/1.5 system-ui,sans-serif;background:#faf8f2;color:#193d31;margin:0}header,main{max-width:1050px;margin:auto;padding:25px}header{display:flex;justify-content:space-between;border-bottom:1px solid #dce3d8}h1{font-size:clamp(30px,5vw,48px);letter-spacing:-.04em}section,article{background:white;border:1px solid #dce3d8;border-radius:14px;padding:22px;margin:18px 0}input,textarea,select{font:inherit;border:1px solid #b4c6ba;border-radius:8px;padding:11px;max-width:100%;width:100%}label{display:block;margin:12px 0 5px;font-weight:600}button{border:0;background:#193d31;color:white;border-radius:8px;padding:12px 20px;margin-top:14px;cursor:pointer;font:inherit}button:disabled{opacity:.5}.hidden{display:none}.muted{color:#5d6c62}.notice{background:#f0f3ea;padding:15px;border-radius:10px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style></head><body><header><strong>forderbar. / Intern</strong><a href="/">Startseite</a></header><main><h1>Fallprüfung</h1><p class="notice">Interne Testumgebung. Nur synthetische Fälle. Keine echten Forderungen, Inkassomandate oder Kundeneinladungen.</p><section id="login"><h2>Team-Anmeldung</h2><form id="signin"><label for="email">Freigeschaltete E-Mail-Adresse</label><input id="email" type="email" required autocomplete="email"><button>Anmeldelink senden</button></form><p id="message" role="status"></p></section><section id="workspace" class="hidden"><h2>Testfall anlegen</h2><p class="muted">Nur anonymisierte, erfundene Testdaten verwenden.</p><form id="newcase"><div class="grid"><div><label for="category">Kategorie</label><select id="category"><option value="retail">Kauf / Handel</option><option value="subscription">Abo</option><option value="telecom">Telekommunikation</option><option value="energy">Energie</option><option value="travel">Reise</option><option value="auto">Auto</option></select></div><div><label for="amount">Forderung in EUR</label><input id="amount" type="number" min=".01" max="100000" step=".01" required></div></div><label for="debtor">Fiktive Gegenpartei</label><input id="debtor" maxlength="120" required><label for="summary">Fiktive Fallschilderung</label><textarea id="summary" maxlength="2000" rows="3" required></textarea><button>Testfall anlegen</button></form><p id="createMessage" role="status"></p><h2>Prüfwarteschlange</h2><button id="reload" type="button">Aktualisieren</button><button id="logout" type="button">Abmelden</button><p id="queueMessage" role="status"></p><div id="queue"></div></section></main><script src="/assets/vendor/supabase.min.js"></script><script>const db=window.supabase.createClient('https://gyapckgyqxqcquxuhunz.supabase.co',"sb_publishable_5qaJkw9dQtYhcQBHF_JDVQ_BgTTFCc2",{auth:{flowType:'pkce',detectSessionInUrl:true}});const $=id=>document.getElementById(id);const statuses=['SUBMITTED','EVIDENCE_REQUIRED','HUMAN_REVIEW','APPROVED','REJECTED'];function el(tag,text){const e=document.createElement(tag);if(text!==undefined)e.textContent=text;return e}async function load(){const {data:{user}}=await db.auth.getUser();$('login').classList.toggle('hidden',!!user);$('workspace').classList.toggle('hidden',!user);if(!user)return;const {data,error}=await db.from('claim_intake_preview').select('id,category,amount_cents,debtor_label,summary,status,created_at,review_note').order('created_at',{ascending:false}).limit(100);$('queue').replaceChildren();$('queueMessage').textContent=error?'Keine Berechtigung zur internen Fallprüfung oder Datenbankfehler.':data.length+' Testfälle';if(error)return;for(const item of data){const card=el('article');card.append(el('h3',item.debtor_label+' · '+(item.amount_cents/100).toLocaleString('de-DE',{style:'currency',currency:'EUR'})));card.append(el('p',item.summary));card.append(el('p','Kategorie: '+item.category+' | Eingegangen: '+new Date(item.created_at).toLocaleString('de-DE')));const label=el('label','Prüfentscheidung');const select=el('select');for(const status of statuses){const option=el('option',status);option.value=status;option.selected=item.status===status;select.append(option)}label.append(select);card.append(label);const noteLabel=el('label','Interne Prüfnotiz');const note=el('textarea');note.value=item.review_note||'';note.rows=2;note.maxLength=2000;noteLabel.append(note);card.append(noteLabel);const button=el('button','Entscheidung speichern');const msg=el('p');msg.setAttribute('role','status');button.onclick=async()=>{button.disabled=true;const {data:{user:current}}=await db.auth.getUser();const {error}=await db.from('claim_intake_preview').update({status:select.value,review_note:note.value,reviewed_at:new Date().toISOString(),reviewed_by:current.id}).eq('id',item.id);msg.textContent=error?'Speichern fehlgeschlagen: '+error.message:'Testentscheidung gespeichert.';button.disabled=false};card.append(button,msg);if(item.status==='APPROVED'){const linkLabel=el('label','Bestehendes synthetisches Kundenkonto zuordnen (E-Mail)');const emailInput=el('input');emailInput.type='email';emailInput.placeholder='testkunde@example.com';linkLabel.append(emailInput);card.append(linkLabel);const linkButton=el('button','Testfall mit Kundenkonto verbinden');const linkMessage=el('p');linkMessage.setAttribute('role','status');linkButton.onclick=async()=>{if(!emailInput.validity.valid||!emailInput.value.trim()){linkMessage.textContent='Gültige E-Mail-Adresse erforderlich.';return}linkButton.disabled=true;const {data,error}=await db.rpc('link_approved_preview_case',{p_intake_id:item.id,p_customer_email:emailInput.value.trim()});linkMessage.textContent=error?'Verknüpfung fehlgeschlagen: '+error.message:'Testfall zugeordnet: '+data;linkButton.disabled=false;if(!error)await load()};card.append(linkButton,linkMessage)}$('queue').append(card)}}$('signin').onsubmit=async e=>{e.preventDefault();const {error}=await db.auth.signInWithOtp({email:$('email').value.trim(),options:{shouldCreateUser:false,emailRedirectTo:location.origin+'/intern/'}});$('message').textContent=error?'Anmeldung nicht möglich.':'Anmeldelink angefordert, sofern das Konto freigeschaltet ist.'};$('newcase').onsubmit=async e=>{e.preventDefault();const cents=Math.round(Number($('amount').value)*100);const {error}=await db.from('claim_intake_preview').insert({category:$('category').value,amount_cents:cents,debtor_label:$('debtor').value.trim(),summary:$('summary').value.trim(),synthetic:true});$('createMessage').textContent=error?'Anlegen fehlgeschlagen: '+error.message:'Testfall angelegt.';if(!error){$('newcase').reset();await load()}};$('reload').onclick=load;$('logout').onclick=async()=>{await db.auth.signOut();await load()};db.auth.onAuthStateChange(()=>setTimeout(load,0));load();</script></body></html>
