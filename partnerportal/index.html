<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Partnerportal | Forderbar</title><style>*{box-sizing:border-box}body{margin:0;background:#faf8f2;color:#193d31;font:16px/1.5 system-ui,sans-serif}header,main{max-width:900px;margin:auto;padding:24px}header{display:flex;justify-content:space-between;border-bottom:1px solid #dce3d8}section,article{background:white;border:1px solid #dce3d8;border-radius:14px;padding:24px;margin:18px 0}h1{font-size:clamp(30px,5vw,48px);letter-spacing:-.04em}label{display:block;font-weight:650;margin:12px 0 5px}input,textarea,select{width:100%;max-width:100%;padding:11px;border:1px solid #aabcb0;border-radius:8px;font:inherit}button{border:0;border-radius:9px;padding:12px 20px;margin-top:14px;background:#193d31;color:white;font:inherit;cursor:pointer}.notice{background:#f0f3ea;padding:15px;border-radius:9px}.hidden{display:none}.muted{color:#5d6c62}</style></head><body><header><strong>forderbar. / Partner</strong><a href="/">Startseite</a></header><main><h1>Partnerportal</h1><p class="notice">Nur Testbetrieb mit erfundenen Daten. Jede Partnerempfehlung wird unabhängig geprüft. Keine automatische Annahme oder Bevollmächtigung.</p><section id="login"><h2>Anmeldung</h2><form id="signin"><label for="email">Freigeschaltete E-Mail</label><input type="email" id="email" autocomplete="email" required><button>Anmeldelink senden</button></form><p id="loginstatus" role="status"></p></section><section id="portal" class="hidden"><h2>Testempfehlung erfassen</h2><form id="referral"><label for="partner">Partnerorganisation</label><select id="partner" required></select><label for="reference">Eigene Testreferenz</label><input id="reference" maxlength="100" required><label for="category">Kategorie</label><select id="category"><option value="retail">Kauf</option><option value="subscription">Abo</option><option value="telecom">Telekommunikation</option><option value="energy">Energie</option><option value="travel">Reise</option><option value="auto">Auto</option></select><label for="amount">Testbetrag in EUR</label><input id="amount" type="number" step=".01" min=".01" max="100000" required><label for="debtor">Fiktive Gegenpartei</label><input id="debtor" maxlength="120" required><label for="summary">Fiktive Beschreibung</label><textarea id="summary" maxlength="2000" rows="3" required></textarea><button>Testempfehlung einreichen</button></form><p id="submitstatus" role="status"></p><h2>Meine Empfehlungen</h2><button id="reload">Aktualisieren</button> <button id="logout">Abmelden</button><p id="liststatus" role="status"></p><div id="list"></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.79.0/dist/umd/supabase.min.js"></script><script>const db=window.supabase.createClient('https://gyapckgyqxqcquxuhunz.supabase.co',"sb_publishable_5qaJkw9dQtYhcQBHF_JDVQ_BgTTFCc2",{auth:{flowType:'pkce',detectSessionInUrl:true}});const $=id=>document.getElementById(id);const el=(tag,text)=>{const e=document.createElement(tag);if(text!==undefined)e.textContent=text;return e};async function refresh(){const {data:{user}}=await db.auth.getUser();$('login').classList.toggle('hidden',!!user);$('portal').classList.toggle('hidden',!user);if(!user)return;const {data:members,error:memberError}=await db.from('partner_members_preview').select('partner_id').eq('user_id',user.id);$('partner').replaceChildren();if(memberError||!members?.length){$('submitstatus').textContent='Kein freigeschalteter Partnerzugang.';$('referral').querySelector('button').disabled=true;return}const ids=members.map(m=>m.partner_id);for(const id of ids){const option=el('option','Partner '+id.slice(0,8));option.value=id;$('partner').append(option)}$('referral').querySelector('button').disabled=false;const {data,error}=await db.from('partner_referrals_preview').select('external_reference,category,amount_cents,status,created_at').in('partner_id',ids).order('created_at',{ascending:false}).limit(100);$('list').replaceChildren();$('liststatus').textContent=error?'Empfehlungen konnten nicht geladen werden.':data.length+' Testempfehlungen';if(error)return;for(const item of data){const card=el('article');card.append(el('h3',item.external_reference));card.append(el('p',item.category+' · '+(item.amount_cents/100).toLocaleString('de-DE',{style:'currency',currency:'EUR'})));card.append(el('p','Status: '+item.status));$('list').append(card)}}$('signin').onsubmit=async e=>{e.preventDefault();const {error}=await db.auth.signInWithOtp({email:$('email').value.trim(),options:{shouldCreateUser:false,emailRedirectTo:location.origin+'/partnerportal/'}});$('loginstatus').textContent=error?'Anmeldung nicht möglich.':'Anmeldelink angefordert, falls der Zugang freigeschaltet ist.'};$('referral').onsubmit=async e=>{e.preventDefault();const {error}=await db.from('partner_referrals_preview').insert({partner_id:$('partner').value,external_reference:$('reference').value.trim(),category:$('category').value,amount_cents:Math.round(Number($('amount').value)*100),debtor_label:$('debtor').value.trim(),summary:$('summary').value.trim(),synthetic:true});$('submitstatus').textContent=error?'Nicht gespeichert: '+error.message:'Testempfehlung gespeichert. Forderbar prüft unabhängig.';if(!error){$('referral').reset();await refresh()}};$('reload').onclick=refresh;$('logout').onclick=async()=>{await db.auth.signOut();await refresh()};db.auth.onAuthStateChange(()=>setTimeout(refresh,0));refresh();</script></body></html>
